<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horizon VM — Browser Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 24px 32px 16px;
      border-bottom: 1px solid #1e2530;
    }

    header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #f8fafc;
    }

    header h1 span { color: #60a5fa; }

    header p {
      margin-top: 4px;
      font-size: 13px;
      color: #64748b;
    }

    .workspace {
      display: grid;
      grid-template-columns: 1fr 1fr;
      flex: 1;
      gap: 0;
    }

    .panel {
      display: flex;
      flex-direction: column;
      border-right: 1px solid #1e2530;
    }

    .panel-header {
      padding: 12px 16px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #475569;
      border-bottom: 1px solid #1e2530;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .panel-header select {
      background: #1e2530;
      border: 1px solid #2d3748;
      color: #94a3b8;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
    }

    textarea {
      flex: 1;
      background: #0d1117;
      color: #e2e8f0;
      border: none;
      padding: 16px;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      font-size: 13px;
      line-height: 1.6;
      resize: none;
      outline: none;
      tab-size: 4;
    }

    textarea::placeholder { color: #2d3748; }

    .output-panel {
      display: flex;
      flex-direction: column;
    }

    .output-body {
      flex: 1;
      padding: 16px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 13px;
      overflow-y: auto;
    }

    .run-bar {
      padding: 12px 16px;
      border-top: 1px solid #1e2530;
      display: flex;
      gap: 8px;
      align-items: center;
      background: #0f1117;
    }

    button {
      padding: 7px 20px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.15s;
    }

    button.primary {
      background: #2563eb;
      color: white;
    }
    button.primary:hover { background: #1d4ed8; }
    button.primary:active { background: #1e40af; }

    button.secondary {
      background: #1e2530;
      color: #94a3b8;
    }
    button.secondary:hover { background: #273040; }

    .steps { font-size: 12px; color: #475569; margin-left: auto; }

    .stack-entry {
      display: flex;
      gap: 12px;
      padding: 6px 8px;
      border-radius: 4px;
      margin-bottom: 4px;
      background: #131720;
    }

    .stack-type {
      font-size: 11px;
      color: #60a5fa;
      min-width: 32px;
    }

    .stack-value { color: #e2e8f0; }

    .err { color: #f87171; }
    .ok  { color: #34d399; }
    .dim { color: #475569; font-style: italic; }

    .example-tag {
      font-size: 11px;
      color: #475569;
      background: #131720;
      border: 1px solid #1e2530;
      border-radius: 4px;
      padding: 2px 6px;
      cursor: pointer;
      transition: border-color 0.1s;
    }
    .example-tag:hover { border-color: #60a5fa; color: #60a5fa; }

    .badge {
      display: inline-block;
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 99px;
      font-weight: 600;
    }
    .badge-draft { background: #1e3a5f; color: #60a5fa; }
  </style>
</head>
<body>
  <header>
    <h1>Horizon <span>VM</span> <span class="badge badge-draft">Draft 0.1</span></h1>
    <p>A browser-native virtual machine — any language, any runtime, no JavaScript required in the execution path</p>
  </header>

  <div class="workspace">
    <div class="panel">
      <div class="panel-header">
        <span>Assembly (.hzs)</span>
        <select id="examples">
          <option value="">Load example…</option>
          <option value="add">3 + 4</option>
          <option value="fib">Fibonacci(10)</option>
          <option value="fact">Factorial(5)</option>
          <option value="ring">Ring level query</option>
        </select>
      </div>
      <textarea id="editor" spellcheck="false" placeholder="; Write Horizon VM assembly here
; Example:
;   PUSH.I32 6
;   PUSH.I32 7
;   I32.MUL
;   RET.VAL
"></textarea>
      <div class="run-bar">
        <button class="primary" id="run-btn">Run</button>
        <button class="secondary" id="clear-btn">Clear</button>
        <span class="steps" id="steps-display"></span>
      </div>
    </div>

    <div class="output-panel">
      <div class="panel-header"><span>Result Stack</span></div>
      <div class="output-body" id="output">
        <span class="dim">— Run a program to see its stack —</span>
      </div>
    </div>
  </div>

  <script type="module">
    import { runAssembly, ValueKind } from './horizon-vm.js';

    const EXAMPLES = {
      add: `; Add two integers
PUSH.I32 3
PUSH.I32 4
I32.ADD
RET.VAL`,

      fib: `; Fibonacci(10) = 55 — iterative
; CALL @label nargs  (nargs = number of args pushed before call)
PUSH.I32 10
CALL @fib 1
RET.VAL

fib:
    ; arg 0 = n.  locals: 0=a, 1=b, 2=i
    ENTER 3
    PUSH.I32 0
    LOCAL.SET 0       ; a = 0
    PUSH.I32 1
    LOCAL.SET 1       ; b = 1
    PUSH.I32 2
    LOCAL.SET 2       ; i = 2

    ARG.GET 0
    PUSH.I32 0
    I32.LE_S
    JNZ @fib_zero

    ARG.GET 0
    PUSH.I32 1
    I32.EQ
    JNZ @fib_one

fib_loop:
    LOCAL.GET 2       ; i
    ARG.GET 0         ; n
    I32.GT_S
    JNZ @fib_done

    LOCAL.GET 0       ; a
    LOCAL.GET 1       ; b
    I32.ADD           ; a + b

    LOCAL.GET 1       ; old b
    LOCAL.SET 0       ; a = old b
    LOCAL.SET 1       ; b = a + b

    LOCAL.GET 2
    PUSH.I32 1
    I32.ADD
    LOCAL.SET 2       ; i++

    JMP @fib_loop

fib_done:
    LOCAL.GET 1
    LEAVE
    RET.VAL

fib_zero:
    PUSH.I32 0
    LEAVE
    RET.VAL

fib_one:
    PUSH.I32 1
    LEAVE
    RET.VAL`,

      fact: `; Factorial(5) = 120 — recursive
; RET.VAL cleans up caller args automatically
PUSH.I32 5
CALL @fact 1    ; 1 arg
RET.VAL

fact:
    ; arg 0 = n
    ENTER 0
    ARG.GET 0
    PUSH.I32 1
    I32.LE_S
    JNZ @fact_base

    ARG.GET 0
    PUSH.I32 1
    I32.SUB
    CALL @fact 1    ; recurse with n-1
    ARG.GET 0       ; n (arg is still accessible; stack was cleaned by RET.VAL)
    I32.MUL
    LEAVE
    RET.VAL

fact_base:
    PUSH.I32 1
    LEAVE
    RET.VAL`,

      ring: `; Query current ring level
; User code runs at Ring 2
RING.GET
RET.VAL`,
    };

    const editor = document.getElementById('editor');
    const output = document.getElementById('output');
    const stepsDisplay = document.getElementById('steps-display');

    document.getElementById('examples').addEventListener('change', (e) => {
      const key = e.target.value;
      if (key && EXAMPLES[key]) {
        editor.value = EXAMPLES[key];
        e.target.value = '';
      }
    });

    document.getElementById('run-btn').addEventListener('click', run);
    document.getElementById('clear-btn').addEventListener('click', () => {
      editor.value = '';
      output.innerHTML = '<span class="dim">— Run a program to see its stack —</span>';
      stepsDisplay.textContent = '';
    });

    editor.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
        e.preventDefault();
        run();
      }
    });

    function run() {
      const src = editor.value.trim();
      if (!src) return;

      output.innerHTML = '';
      stepsDisplay.textContent = '';

      try {
        const { stack, steps } = runAssembly(src);
        stepsDisplay.textContent = `${steps.toLocaleString()} steps`;

        if (stack.length === 0) {
          output.innerHTML = '<span class="dim">— Stack is empty after execution —</span>';
          return;
        }

        for (let i = stack.length - 1; i >= 0; i--) {
          const v = stack[i];
          const isTop = i === stack.length - 1;
          const el = document.createElement('div');
          el.className = 'stack-entry';
          let typeStr, valStr;
          switch (v.kind) {
            case ValueKind.I32: typeStr = 'i32'; valStr = String(v.v); break;
            case ValueKind.I64: typeStr = 'i64'; valStr = String(v.v); break;
            case ValueKind.F32: typeStr = 'f32'; valStr = String(v.v); break;
            case ValueKind.F64: typeStr = 'f64'; valStr = String(v.v); break;
            case ValueKind.Ptr: typeStr = 'ptr'; valStr = '0x' + v.v.toString(16).padStart(8, '0'); break;
          }
          el.innerHTML = `<span class="stack-type">${typeStr}</span><span class="stack-value">${valStr}</span>${isTop ? '&nbsp;<span class="ok" style="font-size:11px">← top</span>' : ''}`;
          output.appendChild(el);
        }
      } catch (e) {
        const isVmFault = e && typeof e.vector === 'number';
        output.innerHTML = isVmFault
          ? `<span class="err">VM Fault (vector 0x${e.vector.toString(16).padStart(2,'0')}): ${e.message}</span>`
          : `<span class="err">Error: ${e.message}</span>`;
      }
    }
  </script>
</body>
</html>
